name: Release

on:
  push:
    branches: ["main"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const { id_token } = await core.getIDToken('https://registry.npmjs.org');
            core.setSecret(id_token);
            core.exportVariable('NODE_AUTH_TOKEN', id_token);
      - uses: changesets/action@v1
        with:
          publish: npx changeset publish --access public
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
